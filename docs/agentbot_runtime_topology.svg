<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 672" font-family="-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Serif CJK TC',sans-serif" role="img" aria-label="AgentBot 執行期拓樸（三程序）">
  <defs>
    <style>
      .h{font-weight:700;font-size:14.5px;fill:#1f2937}
      .s{font-size:11.4px;fill:#5f6f82}
      .lab{font-size:10.8px;font-family:ui-monospace,Menlo,Consolas,monospace;paint-order:stroke;stroke:#eef2f7;stroke-width:4;stroke-linejoin:round}
      .proc{fill:none;stroke:#cbd5e1;stroke-width:1.25;stroke-dasharray:7 6}
      .tag{font:700 11px ui-monospace,monospace}
      .flow{fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;animation:dash .9s linear infinite}
      .ctl{stroke:#475569} .ex{stroke:#8b5cf6} .ev{stroke:#10b981}
      .fut{fill:none;stroke:#f43f5e;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 7;animation:dash 1.5s linear infinite}
      .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      rect[stroke]:not(.proc){filter:url(#cardShadow);stroke-opacity:.88}
      @keyframes dash{to{stroke-dashoffset:-16}}
      @media (prefers-reduced-motion: reduce){.flow,.fut{animation:none}}
    </style>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="128%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.075"/></filter>
    <symbol id="ico-user" viewBox="0 0 24 24"><circle class="ico" cx="12" cy="8" r="3"/><path class="ico" d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="ico-core" viewBox="0 0 24 24"><rect class="ico" x="5" y="5" width="14" height="14" rx="2"/><path class="ico" d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
    <symbol id="ico-redis" viewBox="0 0 24 24"><ellipse class="ico" cx="12" cy="7" rx="7" ry="3"/><path class="ico" d="M5 7v8c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path class="ico" d="M5 11c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
    <symbol id="ico-gpu" viewBox="0 0 24 24"><rect class="ico" x="4" y="6" width="16" height="12" rx="2"/><path class="ico" d="M8 10h4v4H8ZM20 10h2M20 14h2M2 10h2M2 14h2"/></symbol>
    <symbol id="ico-server" viewBox="0 0 24 24"><rect class="ico" x="5" y="4" width="14" height="6" rx="1.5"/><rect class="ico" x="5" y="14" width="14" height="6" rx="1.5"/><path class="ico" d="M8 7h.1M8 17h.1M11 7h5M11 17h5"/></symbol>
    <symbol id="ico-robot" viewBox="0 0 24 24"><rect class="ico" x="6" y="8" width="12" height="9" rx="2"/><path class="ico" d="M12 5v3M9 12h.1M15 12h.1M8 20h8"/></symbol>
    <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#475569"/></marker>
    <marker id="mx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8b5cf6"/></marker>
    <marker id="me" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10b981"/></marker>
    <marker id="mf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#f43f5e"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="672" fill="#eef2f7" rx="18"/>
  <text x="40" y="38" font-size="20" font-weight="800" fill="#0f172a">AgentBot · 執行期拓樸（Runtime Topology）</text>
  <text x="40" y="59" class="s">三個程序；Redis 是「永遠在線的 Core」與「吃 GPU 的 VLA Worker」之間的接縫。上下兩條平行軌道＝任務與事件，互不交叉。</text>

  <!-- 1 User -->
  <rect x="70" y="80" width="290" height="52" rx="15" fill="#fff" stroke="#7dd3fc" stroke-width="1.35"/>
  <use href="#ico-user" x="326" y="94" width="18" height="18" color="#0ea5e9"/>
  <text class="h" x="90" y="103">1 · User Input</text>
  <text class="s" x="90" y="121">語音 · 文字 · UI / 按鈕</text>

  <!-- Core process -->
  <rect class="proc" x="40" y="156" width="350" height="392" rx="16"/>
  <use href="#ico-core" x="358" y="165" width="18" height="18" color="#64748b"/>
  <text x="58" y="178" font="700 12px ui-monospace,monospace" font-weight="700" font-size="12" fill="#64748b">AgentBot Core · 單一程序（任意 Python 環境）</text>

  <rect x="74" y="192" width="282" height="40" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text class="h" x="92" y="217">Gateway <tspan class="s" font-weight="400">(1→2 正規化)</tspan></text>

  <rect x="74" y="244" width="282" height="88" rx="13" fill="#fff" stroke="#a5b4fc" stroke-width="1.35"/>
  <text class="h" x="92" y="268">2 · Brain / ClawBot</text>
  <text class="s" x="92" y="287">LLM（Qwen3-VL，可插拔）· Memory</text>
  <text class="s" x="92" y="305">理解 · 推理(CoT) · 規劃 · 選技能</text>
  <text class="s" x="92" y="323">輸出 = SkillPlan（結構化）</text>

  <rect x="74" y="344" width="282" height="52" rx="13" fill="#fff" stroke="#c4b5fd" stroke-width="1.35"/>
  <text class="h" x="92" y="366">4 · Skill Layer</text>
  <text class="s" x="92" y="384">sort_can · pour_water …（語意動作工具）</text>

  <rect x="74" y="406" width="282" height="52" rx="13" fill="#fff" stroke="#86efac" stroke-width="1.35"/>
  <text class="h" x="92" y="428">3 · Monitor</text>
  <text class="s" x="92" y="446">Ingestor · SafetyWatchdog · StateStore</text>

  <rect x="74" y="470" width="282" height="46" rx="13" fill="#fff" stroke="#7dd3fc" stroke-width="1.35"/>
  <text class="h" x="92" y="493">API + Console</text>
  <text class="s" x="92" y="509" font-size="11">HTTP · WebSocket · /v1/events</text>

  <!-- Redis -->
  <text class="h" x="450" y="322" fill="#b45309">Redis</text>
  <rect x="450" y="330" width="150" height="160" rx="15" fill="#fff8ed" stroke="#fdba74" stroke-width="1.35"/>
  <use href="#ico-redis" x="568" y="304" width="19" height="19" color="#f59e0b"/>
  <rect x="464" y="342" width="122" height="40" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="tag" x="476" y="360" fill="#8b5cf6">List</text><text class="s" x="476" y="376" font-size="11">vla:tasks 佇列</text>
  <rect x="464" y="392" width="122" height="40" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="tag" x="476" y="410" fill="#10b981">Streams</text><text class="s" x="476" y="426" font-size="11">events 事件</text>
  <rect x="464" y="442" width="122" height="38" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="tag" x="476" y="459" fill="#0284c7">Hash</text><text class="s" x="476" y="475" font-size="11">state 即時</text>

  <!-- Worker process -->
  <rect class="proc" x="650" y="156" width="490" height="276" rx="16"/>
  <use href="#ico-gpu" x="1104" y="164" width="18" height="18" color="#8b5cf6"/>
  <text font-weight="700" font-size="12" fill="#64748b" x="668" y="178">VLA Worker · env_isaaclab 程序（GPU）</text>

  <rect x="678" y="192" width="436" height="90" rx="13" fill="#fff" stroke="#c4b5fd" stroke-width="1.35"/>
  <text class="h" x="698" y="216">5 · VLA Execution Engine</text>
  <text class="s" x="698" y="236">isaac_runner.run_rollout — IsaacLab</text>
  <text class="s" x="698" y="254">obs → get_action → step ×16 → success</text>
  <text class="s" x="698" y="272">System 2（policy）+ System 1（control）</text>

  <rect x="678" y="294" width="436" height="38" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text class="h" x="698" y="318" font-size="13.5">policy_server — 啟動 / 健康檢查</text>

  <rect x="678" y="342" width="436" height="34" rx="13" fill="#f8fafc" stroke="#d6deea"/>
  <text class="s" x="698" y="364" font-size="11.5">沿用 scripts/eval/utils（joint_mapper · filter · saver）</text>

  <!-- GR00T server -->
  <rect x="650" y="452" width="490" height="50" rx="15" fill="#fff" stroke="#a5b4fc" stroke-width="1.35"/>
  <use href="#ico-server" x="1104" y="466" width="18" height="18" color="#6366f1"/>
  <text class="h" x="670" y="474">GR00T policy server</text>
  <text class="s" x="670" y="492">ZMQ :5555 · 自有 venv（沿用既有）</text>

  <!-- Future hardware -->
  <rect class="proc" x="650" y="524" width="490" height="54" stroke="#fda4af" rx="16"/>
  <use href="#ico-robot" x="1104" y="538" width="18" height="18" color="#f43f5e"/>
  <text class="h" x="670" y="548" fill="#be123c">6 · 7　未來 — 實機</text>
  <text class="s" x="670" y="566" font-size="11.5">backends/hardware → gr00t_control_robot.py + openarm_ros2（ROS2）</text>

  <!-- ===== FLOWS ===== -->
  <!-- User -> Gateway -->
  <path class="flow ctl" d="M215,132 V192" marker-end="url(#mc)"/>
  <text class="lab" x="224" y="168" fill="#475569">HTTP/WS · POST /v1/chat</text>
  <!-- internal control -->
  <path class="flow ctl" d="M215,232 V244" marker-end="url(#mc)"/>
  <path class="flow ctl" d="M215,332 V344" marker-end="url(#mc)"/>
  <text class="lab" x="224" y="342" fill="#475569">SkillPlan</text>
  <!-- Monitor -> Console -->
  <path class="flow ev" d="M300,458 V470" marker-end="url(#me)"/>

  <!-- TASK rail (violet, y≈363) : Skills -> Redis:List -> Worker -->
  <path class="flow ex" d="M356,366 H450" marker-end="url(#mx)"/>
  <text class="lab" x="360" y="356" fill="#7c3aed">LPUSH VlaTaskRequest</text>
  <path class="flow ex" d="M600,362 H618 Q626,362 626,366 H650" marker-end="url(#mx)"/>
  <text class="lab" x="606" y="354" fill="#7c3aed">BRPOP → run_rollout</text>

  <!-- EVENT rail (green, y≈414) : Worker -> Redis:Streams -> Monitor -->
  <path class="flow ev" d="M650,416 H634 Q626,416 626,412 H600" marker-end="url(#me)"/>
  <text class="lab" x="606" y="434" fill="#059669">XADD telemetry / result</text>
  <path class="flow ev" d="M450,412 H422 Q414,412 414,420 V422 Q414,430 406,430 H356" marker-end="url(#me)"/>
  <text class="lab" x="396" y="404" fill="#059669">XREAD</text>

  <!-- feedback (green) on the left gutter, avoids Skills -->
  <path class="flow ev" d="M74,432 H64 Q56,432 56,424 V296 Q56,288 64,288 H74" marker-end="url(#me)"/>
  <text class="s" x="30" y="364" fill="#059669" transform="rotate(-90 30,364)">feedback 迴授</text>

  <!-- Worker -> GR00T -->
  <path class="flow ctl" d="M895,432 V452" marker-end="url(#mc)"/>
  <text class="lab" x="905" y="446" fill="#475569">ZMQ :5555 · get_action</text>

  <!-- GR00T -> future HW -->
  <path class="fut" d="M895,502 V524" marker-end="url(#mf)"/>
  <text class="lab" x="905" y="518" fill="#be123c">未來：改走 backends/hardware（不經模擬）</text>

  <!-- ===== integrated legend ===== -->
  <rect x="40" y="600" width="1100" height="52" rx="14" fill="#fff" stroke="#d6deea"/>
  <text class="s" x="56" y="620" font-weight="700" fill="#334155">圖例</text>
  <circle cx="116" cy="616" r="6" fill="#0ea5e9"/><text class="s" x="128" y="620">1 User</text>
  <circle cx="192" cy="616" r="6" fill="#6366f1"/><text class="s" x="204" y="620">2 Brain</text>
  <circle cx="274" cy="616" r="6" fill="#10b981"/><text class="s" x="286" y="620">3 Monitor</text>
  <circle cx="368" cy="616" r="6" fill="#8b5cf6"/><text class="s" x="380" y="620">4 Skill / 5 VLA</text>
  <circle cx="496" cy="616" r="6" fill="#f59e0b"/><text class="s" x="508" y="620">Redis</text>
  <circle cx="566" cy="616" r="6" fill="#f43f5e"/><text class="s" x="578" y="620">6·7 未來</text>
  <line x1="56" y1="640" x2="86" y2="640" stroke="#475569" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="92" y="644">control</text>
  <line x1="170" y1="640" x2="200" y2="640" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="206" y="644">execution（jobs）</text>
  <line x1="344" y1="640" x2="374" y2="640" stroke="#10b981" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="380" y="644">events / feedback</text>
  <line x1="512" y1="640" x2="542" y2="640" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 7"/><text class="s" x="548" y="644">未來（虛線框）</text>
  <text class="s" x="700" y="644" fill="#334155">虛線「流動方向」＝資料流方向；實線方框＝元件，破折框＝程序邊界 / 未來。</text>
</svg>
