<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" font-family="-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Serif CJK TC',sans-serif" role="img" aria-label="AgentBot 命令編排生命週期">
  <defs>
    <style>
      .h{font-weight:700;font-size:14.5px;fill:#1f2937}
      .s{font-size:11.5px;fill:#5f6f82}
      .lab{font-size:10.8px;font-family:ui-monospace,Menlo,Consolas,monospace;paint-order:stroke;stroke:#eef2f7;stroke-width:4;stroke-linejoin:round}
      .flow{fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;animation:dash .9s linear infinite}
      .ctl{stroke:#475569} .ex{stroke:#8b5cf6} .ev{stroke:#10b981} .rec{stroke:#64748b}
      .rt{fill:none;stroke:#f59e0b;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;animation:dash 1.3s linear infinite}
      .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
      rect[stroke]{filter:url(#cardShadow);stroke-opacity:.86}
      .labelBox{filter:none;fill:#f8fafc;stroke:#dbe4f0;stroke-width:.8;opacity:.96}
      .legendBox{filter:url(#cardShadow);fill:#fff;stroke:#d6deea;stroke-width:1;stroke-opacity:.9}
      @keyframes dash{to{stroke-dashoffset:-16}}
      @media (prefers-reduced-motion: reduce){.flow,.rt{animation:none}}
    </style>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="128%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <symbol id="ico-screen" viewBox="0 0 24 24"><rect class="ico" x="4" y="5" width="16" height="12" rx="2"/><path class="ico" d="M9 20h6M12 17v3"/></symbol>
    <symbol id="ico-queue" viewBox="0 0 24 24"><path class="ico" d="M6 7h12M6 12h12M6 17h8"/><circle class="ico" cx="18" cy="17" r="1.4"/></symbol>
    <symbol id="ico-brain" viewBox="0 0 24 24"><path class="ico" d="M8 17V8.5a3 3 0 0 1 5.2-2.1A3.4 3.4 0 0 1 19 8.8V17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3Z"/><path class="ico" d="M12 7v13M8 11h4M12 14h5"/></symbol>
    <symbol id="ico-run" viewBox="0 0 24 24"><rect class="ico" x="4" y="5" width="16" height="14" rx="2"/><path class="ico" d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="ico-monitor" viewBox="0 0 24 24"><path class="ico" d="M4 13h4l2-5 4 10 2-5h4"/><path class="ico" d="M4 19h16"/></symbol>
    <symbol id="ico-record" viewBox="0 0 24 24"><path class="ico" d="M7 4h8l3 3v13H7Z"/><path class="ico" d="M15 4v4h3M9 12h6M9 16h6"/></symbol>
    <symbol id="ico-check" viewBox="0 0 24 24"><circle class="ico" cx="12" cy="12" r="8"/><path class="ico" d="m8.5 12.5 2.4 2.4 4.8-5.2"/></symbol>
    <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#475569"/></marker>
    <marker id="mx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8b5cf6"/></marker>
    <marker id="me" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10b981"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#f59e0b"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="540" fill="#eef2f7" rx="18"/>
  <text x="40" y="38" font-size="20" font-weight="800" fill="#0f172a">AgentBot · 命令編排生命週期（Phase 2）</text>
  <text x="40" y="59" class="s">一句命令 → 大腦拆成有序 atomic skills → 常駐 IsaacLab 逐一執行（Monitor 把關，失敗重試/重規劃）→ 全程紀錄 → done。虛線＝資料流方向。</text>

  <!-- ===== main column: 1-6 ===== -->
  <!-- 1 UI -->
  <rect x="120" y="70" width="360" height="42" rx="14" fill="#fff" stroke="#7dd3fc" stroke-width="1.35"/>
  <use href="#ico-screen" x="446" y="82" width="18" height="18" color="#0ea5e9"/>
  <text class="h" x="142" y="92">1 · UI / Dashboard</text>
  <text class="s" x="142" y="109">輸入命令 · Dashboard / Console</text>
  <!-- 2 command queue -->
  <rect x="120" y="140" width="360" height="42" rx="14" fill="#fff8ed" stroke="#fdba74" stroke-width="1.35"/>
  <use href="#ico-queue" x="446" y="152" width="18" height="18" color="#f59e0b"/>
  <text class="h" x="142" y="162">2 · 命令佇列</text>
  <text class="s" x="142" y="179">Redis List · FIFO（可清除）</text>
  <!-- 3 orchestrator -->
  <rect x="120" y="210" width="360" height="54" rx="14" fill="#f2f5ff" stroke="#a5b4fc" stroke-width="1.55"/>
  <use href="#ico-brain" x="446" y="221" width="19" height="19" color="#6366f1"/>
  <text class="h" x="142" y="232">3 · Brain Orchestrator</text>
  <text class="s" x="142" y="251">取最舊命令 → VLM 拆解 → SkillPlan</text>
  <text class="s" x="142" y="262">Monitor 把關才推進</text>
  <!-- SkillPlan -->
  <rect x="120" y="292" width="360" height="42" rx="14" fill="#fff" stroke="#d8e0ff"/>
  <text class="h" x="142" y="313" fill="#4338ca">SkillPlan</text>
  <text class="s" x="142" y="330">[ skill₁ → skill₂ → … ]（有序）</text>
  <!-- 4/5 merged VLA module -->
  <rect x="120" y="362" width="360" height="48" rx="14" fill="#f7f5ff" stroke="#c4b5fd" stroke-width="1.55"/>
  <use href="#ico-run" x="446" y="373" width="19" height="19" color="#8b5cf6"/>
  <text class="h" x="142" y="384">4/5 · VLA 執行模組</text>
  <text class="s" x="142" y="403">Job Queue + 常駐 sim_session</text>
  <!-- 6 monitor confirm -->
  <rect x="120" y="438" width="360" height="46" rx="14" fill="#effdf6" stroke="#86efac" stroke-width="1.35"/>
  <use href="#ico-monitor" x="446" y="450" width="18" height="18" color="#10b981"/>
  <text class="h" x="142" y="459" fill="#047857">6 · Monitor 確認</text>
  <text class="s" x="142" y="478">ResultWaiter + judge</text>

  <!-- ===== side column: records / done ===== -->
  <!-- 7 records -->
  <rect x="620" y="210" width="340" height="68" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.35"/>
  <use href="#ico-record" x="924" y="224" width="18" height="18" color="#64748b"/>
  <text class="h" x="642" y="238">7 · Records（History）</text>
  <text class="s" x="642" y="259">commands · skill_runs · stats</text>
  <text class="s" x="642" y="274">全程紀錄每一步與統計</text>
  <!-- done -->
  <rect x="620" y="422" width="340" height="58" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.45"/>
  <use href="#ico-check" x="924" y="434" width="18" height="18" color="#10b981"/>
  <text class="h" x="642" y="450" fill="#047857">命令 DONE → idle/等待</text>
  <text class="s" x="642" y="470">全部 skill 完成；無新命令則回等待</text>

  <!-- ===== flows ===== -->
  <path class="flow ctl" d="M300,112 V140" marker-end="url(#mc)"/>
  <rect class="labelBox" x="326" y="120" width="38" height="17" rx="7"/><text class="lab" x="334" y="132" fill="#475569">POST</text>
  <path class="flow ctl" d="M300,182 V210" marker-end="url(#mc)"/>
  <rect class="labelBox" x="326" y="190" width="30" height="17" rx="7"/><text class="lab" x="334" y="202" fill="#475569">pop</text>
  <path class="flow ex" d="M300,264 V292" marker-end="url(#mx)"/>
  <rect class="labelBox" x="326" y="272" width="38" height="17" rx="7"/><text class="lab" x="334" y="284" fill="#7c3aed">plan</text>
  <path class="flow ex" d="M300,334 V362" marker-end="url(#mx)"/>
  <rect class="labelBox" x="326" y="342" width="118" height="18" rx="7"/><text class="lab" x="336" y="355" fill="#7c3aed">LPUSH vla:tasks</text>
  <path class="flow ev" d="M300,410 V438" marker-end="url(#me)"/>
  <rect class="labelBox" x="326" y="418" width="86" height="17" rx="7"/><text class="lab" x="334" y="430" fill="#059669">XADD result</text>

  <!-- side outputs -->
  <path class="flow rec" d="M480,244 H620" marker-end="url(#mc)"/>
  <rect class="labelBox" x="496" y="220" width="78" height="18" rx="7"/><text class="lab" x="506" y="233" fill="#475569">紀錄每一步</text>
  <path class="flow ev" d="M480,451 H620" marker-end="url(#me)"/>
  <path class="rt" d="M480,438 H560 V348 H480" marker-end="url(#ma)"/>
  <rect class="labelBox" x="498" y="318" width="208" height="18" rx="7"/><text class="lab" x="506" y="331" fill="#b45309">✓ 下一個 skill　／　✗ 重試 N → 重規劃 / 中止</text>

  <!-- legend -->
  <rect class="legendBox" x="230" y="508" width="720" height="24" rx="12"/>
  <text class="s" x="248" y="524" font-weight="700" fill="#334155">圖例</text>
  <line x1="302" y1="520" x2="328" y2="520" stroke="#475569" stroke-width="2.4" stroke-dasharray="8 7"/><text class="s" x="336" y="524">control</text>
  <line x1="408" y1="520" x2="434" y2="520" stroke="#8b5cf6" stroke-width="2.4" stroke-dasharray="8 7"/><text class="s" x="442" y="524">skill</text>
  <line x1="508" y1="520" x2="534" y2="520" stroke="#10b981" stroke-width="2.4" stroke-dasharray="8 7"/><text class="s" x="542" y="524">結果</text>
  <line x1="606" y1="520" x2="632" y2="520" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="7 7"/><text class="s" x="640" y="524">推進/重試</text>
  <circle cx="770" cy="520" r="5" fill="#0ea5e9"/><text class="s" x="782" y="524">主流程</text>
  <circle cx="854" cy="520" r="5" fill="#64748b"/><text class="s" x="866" y="524">Records</text>
</svg>
