<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 860" font-family="-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Serif CJK TC',sans-serif" role="img" aria-label="AgentBot 系統地圖（七個區塊）">
  <defs>
    <style>
      .h{font-weight:700;font-size:15px;fill:#1f2937}
      .h2{font-weight:700;font-size:13.5px;fill:#1f2937}
      .s{font-size:11.5px;fill:#5f6f82}
      .chip{font-size:11.5px;fill:#334155}
      .flow{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;animation:dash 1s linear infinite}
      .instr{stroke:#0ea5e9} .skill{stroke:#8b5cf6} .act{stroke:#6366f1} .evt{stroke:#10b981}
      .fut{fill:none;stroke:#f43f5e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 8;animation:dash 1.6s linear infinite}
      .safe{fill:none;stroke:#f43f5e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 6;animation:dash .7s linear infinite}
      .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .labhalo{paint-order:stroke;stroke:#eef2f7;stroke-width:4;stroke-linejoin:round}
      rect[stroke]{filter:url(#cardShadow);stroke-opacity:.88}
      @keyframes dash{to{stroke-dashoffset:-18}}
      @media (prefers-reduced-motion: reduce){.flow,.fut,.safe{animation:none}}
    </style>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.075"/></filter>
    <symbol id="ico-monitor" viewBox="0 0 24 24"><path class="ico" d="M4 13h4l2-5 4 10 2-5h4"/><path class="ico" d="M4 19h16"/></symbol>
    <symbol id="ico-user" viewBox="0 0 24 24"><circle class="ico" cx="12" cy="8" r="3"/><path class="ico" d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="ico-brain" viewBox="0 0 24 24"><path class="ico" d="M8 17V8.5a3 3 0 0 1 5.2-2.1A3.4 3.4 0 0 1 19 8.8V17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3Z"/><path class="ico" d="M12 7v13M8 11h4M12 14h5"/></symbol>
    <symbol id="ico-tool" viewBox="0 0 24 24"><path class="ico" d="m14.5 6.5 3 3M5 19l4.5-1 8-8a2.1 2.1 0 0 0-3-3l-8 8Z"/><path class="ico" d="M4 8h5M4 12h3"/></symbol>
    <symbol id="ico-run" viewBox="0 0 24 24"><rect class="ico" x="4" y="5" width="16" height="14" rx="2"/><path class="ico" d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="ico-robot" viewBox="0 0 24 24"><rect class="ico" x="6" y="8" width="12" height="9" rx="2"/><path class="ico" d="M12 5v3M9 12h.1M15 12h.1M8 20h8"/></symbol>
    <symbol id="ico-world" viewBox="0 0 24 24"><circle class="ico" cx="12" cy="12" r="8"/><path class="ico" d="M4 12h16M12 4c2 2.2 3 4.8 3 8s-1 5.8-3 8M12 4c-2 2.2-3 4.8-3 8s1 5.8 3 8"/></symbol>
    <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#0ea5e9"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8b5cf6"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6366f1"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10b981"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#f43f5e"/></marker>
  </defs>

  <rect x="0" y="0" width="1060" height="860" fill="#eef2f7" rx="18"/>
  <text x="40" y="40" font-size="21" font-weight="800" fill="#0f172a">AgentBot · 系統地圖（System Map）</text>
  <text x="40" y="62" class="s">自然語言 → 大腦推理規劃 → 選技能 → 驅動 VLA 執行；Monitor 觀測全層並迴授。虛線沿箭頭流動＝資料流方向。</text>

  <!-- ===== Monitor rail (block 3, left) ===== -->
  <rect x="40" y="374" width="216" height="284" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <use href="#ico-monitor" x="222" y="392" width="18" height="18" color="#10b981"/>
  <text class="h" x="60" y="406" fill="#047857">3 · Monitor / Event Bus</text>
  <text class="s" x="60" y="426">即時觀測全層 + 迴授迴路</text>
  <rect x="60" y="438" width="176" height="33" rx="10" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="74" y="455">機器人狀態</text><text class="s" x="74" y="468" font-size="9.6">running / blocked / fail</text>
  <rect x="60" y="477" width="176" height="33" rx="10" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="74" y="494">環境</text><text class="s" x="74" y="507" font-size="9.6">物件 / 人 / 場景</text>
  <rect x="60" y="516" width="176" height="33" rx="10" fill="#fff" stroke="#fecaca"/><text class="chip" x="74" y="533" fill="#b91c1c">安全 Safety</text><text class="s" x="74" y="546" font-size="9.6">碰撞 / 緊急 / 違規</text>
  <rect x="60" y="555" width="176" height="33" rx="10" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="74" y="572">系統狀態</text><text class="s" x="74" y="585" font-size="9.6">電量 / 溫度 / 頻寬</text>
  <rect x="60" y="600" width="176" height="46" rx="10" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text class="h2" x="74" y="618" fill="#047857">迴授 Feedback</text>
  <text class="s" x="74" y="633" font-size="9.8">資料 / 感測　狀態 / 結果</text>
  <text class="s" x="74" y="646" font-size="9.8">成功 / 失敗　interrupt（中斷）</text>

  <!-- ===== Main column (blocks 1,2,4,5,6,7) ===== -->
  <!-- 1 User -->
  <rect x="320" y="80" width="440" height="92" rx="18" fill="#fff" stroke="#7dd3fc" stroke-width="1.5"/>
  <use href="#ico-user" x="724" y="96" width="18" height="18" color="#0ea5e9"/>
  <text class="h" x="340" y="106">1 · User Input Layer</text>
  <rect x="340" y="118" width="126" height="42" rx="10" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="354" y="136">語音</text><text class="s" x="354" y="152" font-size="10.5">ASR / TTS</text>
  <rect x="476" y="118" width="126" height="42" rx="10" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="490" y="136">文字</text><text class="s" x="490" y="152" font-size="10.5">Chat / Command</text>
  <rect x="612" y="118" width="128" height="42" rx="10" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="626" y="136">UI / 按鈕</text><text class="s" x="626" y="152" font-size="10.5">App / Panel</text>

  <!-- 2 Brain -->
  <rect x="320" y="206" width="440" height="158" rx="18" fill="#fff" stroke="#a5b4fc" stroke-width="1.65"/>
  <use href="#ico-brain" x="724" y="222" width="19" height="19" color="#6366f1"/>
  <text class="h" x="340" y="232">2 · Brain / ClawBot（大腦）</text>
  <rect x="340" y="246" width="200" height="44" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text class="h2" x="354" y="264">LLM</text><text class="s" x="354" y="280" font-size="10.8">Qwen3-VL（可插拔）</text>
  <rect x="550" y="246" width="190" height="44" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text class="h2" x="564" y="264">Memory</text><text class="s" x="564" y="280" font-size="10.8">對話 / 情節 / 語意</text>
  <rect x="340" y="300" width="400" height="24" rx="9" fill="#f8faff" stroke="#e0e7ff"/><text class="s" x="354" y="316" font-size="10.8">理解 · 推理(CoT) · 規劃(High-level) · 選技能 · 對話</text>
  <rect x="340" y="332" width="400" height="24" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text class="s" x="354" y="348" font-size="10.8" fill="#4338ca">⤷ 結構化輸出 SkillPlan：intent · goal · skill calls · params · safety_flags</text>

  <!-- 4 Skill -->
  <rect x="320" y="398" width="440" height="86" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="1.65"/>
  <use href="#ico-tool" x="724" y="414" width="18" height="18" color="#8b5cf6"/>
  <text class="h" x="340" y="424">4 · Skill Layer（語意動作工具）</text>
  <rect x="340" y="438" width="118" height="34" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text class="chip" x="354" y="459">sort_can</text>
  <rect x="468" y="438" width="118" height="34" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text class="chip" x="482" y="459">pour_water</text>
  <rect x="596" y="438" width="144" height="34" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text class="s" x="610" y="459" font-size="10.8">…可重用、含參數/約束</text>

  <!-- 5 VLA -->
  <rect x="320" y="518" width="440" height="118" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="1.65"/>
  <use href="#ico-run" x="724" y="534" width="18" height="18" color="#8b5cf6"/>
  <text class="h" x="340" y="544">5 · VLA Execution Engine</text>
  <text class="s" x="340" y="562">GR00T + IsaacLab（沿用 scripts/eval）</text>
  <rect x="340" y="572" width="200" height="50" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text class="h2" x="354" y="591">System 2 · Policy</text><text class="s" x="354" y="609" font-size="10.8">GR00T 推論（思考/規劃）</text>
  <rect x="550" y="572" width="190" height="50" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text class="h2" x="564" y="591">System 1 · Control</text><text class="s" x="564" y="609" font-size="10.8">即時閉環控制</text>

  <!-- 6 Robot Control (future) -->
  <rect x="320" y="670" width="440" height="70" rx="18" fill="#fff5f5" stroke="#fda4af" stroke-width="1.35" stroke-dasharray="7 6"/>
  <use href="#ico-robot" x="724" y="686" width="18" height="18" color="#f43f5e"/>
  <text class="h" x="340" y="696" fill="#be123c">6 · Robot Control（low-level）<tspan class="s" font-weight="400" fill="#9f1239">　未來</tspan></text>
  <text class="s" x="340" y="722">運動 · 夾爪 · 底盤 · 全身控制　|　Emergency Stop（緊急停止覆寫）</text>

  <!-- 7 Physical (future) -->
  <rect x="320" y="752" width="440" height="56" rx="18" fill="#fff5f5" stroke="#fda4af" stroke-width="1.35" stroke-dasharray="7 6"/>
  <use href="#ico-world" x="724" y="766" width="18" height="18" color="#f43f5e"/>
  <text class="h" x="340" y="778" fill="#be123c">7 · Physical World<tspan class="s" font-weight="400" fill="#9f1239">　未來</tspan></text>
  <text class="s" x="340" y="800">機器人 · 物件 · 人 · 環境（OpenArm via openarm_ros2）</text>

  <!-- ===== main vertical flows ===== -->
  <path class="flow instr" d="M540,172 V206" marker-end="url(#i)"/><text class="s" x="548" y="193" fill="#0284c7" font-size="11">指令 instruction</text>
  <path class="flow skill" d="M540,364 V398" marker-end="url(#k)"/><text class="s" x="548" y="385" fill="#7c3aed" font-size="11">skill calls</text>
  <path class="flow skill" d="M540,484 V518" marker-end="url(#k)"/><text class="s" x="548" y="505" fill="#7c3aed" font-size="11">VlaTaskRequest</text>
  <path class="fut" d="M540,636 V670" marker-end="url(#r)"/><text class="s" x="548" y="657" fill="#be123c" font-size="11">actions（未來實機）</text>
  <path class="fut" d="M540,740 V752" marker-end="url(#r)"/>

  <!-- ===== monitor flows ===== -->
  <!-- VLA -> Monitor (state/telemetry) -->
  <path class="flow evt" d="M320,560 H256" marker-end="url(#g)"/>
  <text class="s labhalo" x="264" y="552" fill="#059669" font-size="10.8">狀態 / 遙測</text>
  <!-- Monitor -> Brain (feedback up) -->
  <path class="flow evt" d="M148,374 V286 H320" marker-end="url(#g)"/>
  <text class="s labhalo" x="160" y="350" fill="#059669" font-size="10.8">迴授</text>
  <!-- Safety: Monitor -> Robot Control (immediate stop) -->
  <path class="safe" d="M150,658 V697 Q150,705 158,705 H320" marker-end="url(#r)"/>
  <text class="s labhalo" x="160" y="690" fill="#be123c" font-size="10.8">立即安全停止</text>

  <!-- ===== integrated legend / core concepts (right) ===== -->
  <rect x="788" y="206" width="232" height="430" rx="18" fill="#fff" stroke="#d6deea"/>
  <text class="h2" x="806" y="232" fill="#334155">核心概念 / 圖例</text>
  <text class="s" x="806" y="258" font-size="11"><tspan font-weight="700" fill="#4338ca">大腦＝Agent</tspan>：高階推理、</text>
  <text class="s" x="806" y="274" font-size="11">規劃、記憶、選技能。</text>
  <text class="s" x="806" y="300" font-size="11"><tspan font-weight="700" fill="#7c3aed">技能＝語意工具</tspan>：可重用</text>
  <text class="s" x="806" y="316" font-size="11">原子動作 + 參數/約束。</text>
  <text class="s" x="806" y="342" font-size="11"><tspan font-weight="700" fill="#7c3aed">VLA＝執行引擎</tspan>：結合</text>
  <text class="s" x="806" y="358" font-size="11">System 2（policy）與</text>
  <text class="s" x="806" y="374" font-size="11">System 1（control）。</text>

  <line x1="806" y1="402" x2="838" y2="402" class="flow instr" marker-end="url(#i)"/><text class="s" x="846" y="406" font-size="10.8">指令 instruction</text>
  <line x1="806" y1="428" x2="838" y2="428" class="flow skill" marker-end="url(#k)"/><text class="s" x="846" y="432" font-size="10.8">skill / task（資料流）</text>
  <line x1="806" y1="454" x2="838" y2="454" class="flow act" marker-end="url(#a)"/><text class="s" x="846" y="458" font-size="10.8">action flow</text>
  <line x1="806" y1="480" x2="838" y2="480" class="flow evt" marker-end="url(#g)"/><text class="s" x="846" y="484" font-size="10.8">事件 / 迴授</text>
  <line x1="806" y1="506" x2="838" y2="506" class="safe" marker-end="url(#r)"/><text class="s" x="846" y="510" font-size="10.8">立即安全（紅）</text>
  <line x1="806" y1="532" x2="838" y2="532" class="fut" marker-end="url(#r)"/><text class="s" x="846" y="536" font-size="10.8">未來實機路徑</text>

  <rect x="806" y="552" width="196" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="s" x="820" y="571" font-size="10.6" font-weight="700" fill="#334155">本次交付（Phase 0）</text>
  <text class="s" x="820" y="588" font-size="10.6">已建：1·2·4·5 + 3（模擬）</text>
  <text class="s" x="820" y="604" font-size="10.6">未來：6·7（實機，虛線）</text>
  <text class="s" x="820" y="617" font-size="10.1" fill="#94a3b8">破折框＝未來 / 程序邊界</text>

  <!-- ===== bottom legend ===== -->
  <rect x="40" y="820" width="980" height="30" rx="14" fill="#fff" stroke="#d6deea"/>
  <text class="s" x="58" y="839" font-weight="700" fill="#334155">圖例</text>
  <line x1="112" y1="835" x2="138" y2="835" class="flow instr" marker-end="url(#i)"/><text class="s" x="146" y="839" font-size="10.5">指令</text>
  <line x1="202" y1="835" x2="228" y2="835" class="flow skill" marker-end="url(#k)"/><text class="s" x="236" y="839" font-size="10.5">skill / task</text>
  <line x1="338" y1="835" x2="364" y2="835" class="flow evt" marker-end="url(#g)"/><text class="s" x="372" y="839" font-size="10.5">事件 / 迴授</text>
  <line x1="478" y1="835" x2="504" y2="835" class="safe" marker-end="url(#r)"/><text class="s" x="512" y="839" font-size="10.5">立即安全</text>
  <line x1="620" y1="835" x2="646" y2="835" class="fut" marker-end="url(#r)"/><text class="s" x="654" y="839" font-size="10.5">未來實機</text>
  <circle cx="758" cy="835" r="5" fill="#0ea5e9"/><text class="s" x="768" y="839" font-size="10.5">輸入</text>
  <circle cx="822" cy="835" r="5" fill="#6366f1"/><text class="s" x="832" y="839" font-size="10.5">大腦</text>
  <circle cx="886" cy="835" r="5" fill="#10b981"/><text class="s" x="896" y="839" font-size="10.5">Monitor</text>
  <circle cx="970" cy="835" r="5" fill="#f43f5e"/><text class="s" x="980" y="839" font-size="10.5">未來</text>
</svg>
